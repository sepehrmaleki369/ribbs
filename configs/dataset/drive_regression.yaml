# Drive dataset configuration for regression (distance map prediction)
seed: 42  # Random seed
split_cfg:
  seed: 42
  index_save_pth: "./drive/inds_regression"
  sources:
    # Training data
    - type: "folder"
      path: "./drive"
      layout: "folders"
      modalities:
        image:
          folder: "training/images_npy"
        distance_map:
          folder: "training/distance_maps"
      splits:
        train: "training"
        valid: "training"  # Use training data for validation too

base_modalities: ["distance_map", "image"]

# -----------------------------------------------------------------------------
# Dimensionality & Patch Extraction
# -----------------------------------------------------------------------------
data_dim: 2                # 2 = 2D patches, 3 = 3D volumes
patch_size: [512, 512]            
max_images: null           # limit number of loaded images (null = no limit)

# -----------------------------------------------------------------------------
# Processing order
# -----------------------------------------------------------------------------
order_ops: []  # No processing operations

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
train_batch_size: 2        # Reduced from 4 to 2 for memory efficiency
val_batch_size: 1          # Reduced from 2 to 1 for Snake Fast memory efficiency
test_batch_size: 1         # Reduced from 2 to 1 for Snake Fast memory efficiency
num_workers: 0             # Reduced from 4 to 0 to save memory
pin_memory: false          # Disabled to save memory

# Training configuration
training:
  num_epochs: 150
  resume_checkpoint: "/content/drive/MyDrive/ribbs/checkpoints_clipped_mse_simple/checkpoint_epoch_100.pth"
  learning_rate: 0.001
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
    lr_decay: true
    lr_decay_factor: 0.1
  
# Debug configuration
debug:
  level: "batch"              # Options: "batch", "epoch", "minimal"
  snake_loss_verbose: true     # Show detailed snake loss debugging
  device_checks: true          # Show device matching checks
  graph_loading: true          # Show graph loading status
  save_evolved_graphs: true    # Save evolved graphs during training

snake_loss:
  enabled: true
  type: simple             # Using Snake Simple
  start_epoch: 101         # Start Snake Simple at epoch 101 (after resuming from epoch 100)
  pretrained_checkpoint: null
  ndims: 2                 # 2D for image data
  stepsz: 0.5              # INCREASED: Stronger step size for more movement
  alpha: 0.01              # INCREASED: Much stronger elasticity (was 0.0001)
  beta: 0.1                # INCREASED: Stronger curvature (was 0.01)
  fltrstdev: 0.5
  nsteps: 20               # INCREASED: More optimization steps (was 5)
  cropsz: [16, 16]        # [16, 16] for simple
  dmax: 15.0               # Matches your clipped distance maps
  maxedgelen: 3.0          # 3.0 for simple
  extgradfac: 2.0          # INCREASED: Stronger gradient influence (was 1.0)
  evolved_graphs_dir: graphs/evolved 