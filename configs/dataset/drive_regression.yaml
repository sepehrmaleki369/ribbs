# Drive dataset configuration for regression (distance map prediction)
seed: 42  # Random seed
split_cfg:
  seed: 42
  index_save_pth: "./drive/inds_regression"
  sources:
    # Training data
    - type: "folder"
      path: "./drive"
      layout: "folders"
      modalities:
        image:
          folder: "training/images_npy"
        distance_map:
          folder: "training/distance_maps"
      splits:
        train: "training"
        valid: "training"  # Use training data for validation too

base_modalities: ["distance_map", "image"]

# -----------------------------------------------------------------------------
# Dimensionality & Patch Extraction
# -----------------------------------------------------------------------------
data_dim: 2                # 2 = 2D patches, 3 = 3D volumes
patch_size: [512, 512]            
max_images: null           # limit number of loaded images (null = no limit)

# -----------------------------------------------------------------------------
# Processing order
# -----------------------------------------------------------------------------
order_ops: []  # No processing operations

# -----------------------------------------------------------------------------
# DataLoader Settings
# -----------------------------------------------------------------------------
train_batch_size: 1        # Reduced from 4 to 1 for Snake Fast memory efficiency
val_batch_size: 1          # Reduced from 2 to 1 for Snake Fast memory efficiency
test_batch_size: 1         # Reduced from 2 to 1 for Snake Fast memory efficiency
num_workers: 0             # Reduced from 4 to 0 to save memory
pin_memory: false          # Disabled to save memory

training:
  num_epochs: 300
  resume_checkpoint: /content/drive/MyDrive/ribbs/checkpoints_regression/checkpoint_epoch_200.pth
  additional_epochs: 100

snake_loss:
  enabled: true
  type: fast
  start_epoch: 201        # switch right after resuming from epoch 200
  pretrained_checkpoint: null
  stepsz: 0.1
  alpha: 0.0001
  beta: 0.01
  fltrstdev: 0.5
  nsteps: 5               # Reduced from 10 to 5 to save memory
  cropsz: [16, 16]        # Further reduced from [32, 32] for extreme memory efficiency
  dmax: 15.0              # Reduced from 155.0 to match baseline
  maxedgelen: 3.0         # Further reduced from 5.0 to save memory
  extgradfac: 1.0         # Reduced from 2.0 to save memory 